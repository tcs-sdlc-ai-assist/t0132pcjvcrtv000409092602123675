services:
  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:////tmp/meridian/app.db}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-true}
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
